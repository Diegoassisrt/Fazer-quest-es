<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estratégia Concursos - Plataforma de Estudos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- PDF.js para leitura de PDFs no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9k7aqcBb2dVMVMA6zp0PAN6rLvADReaI",
            authDomain: "questoes-b0c0b.firebaseapp.com",
            projectId: "questoes-b0c0b",
            storageBucket: "questoes-b0c0b.firebasestorage.app",
            messagingSenderId: "194950212696",
            appId: "1:194950212696:web:b4b59dbf93460088056e2d",
            measurementId: "G-8H53FTS93Y"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged };
        window.firebaseDb = { db, doc, setDoc, getDoc };
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Tela de Autenticação -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold text-slate-900">Estratégia Concursos</h1>
                <p class="text-sm text-slate-500">Faça login para sincronizar os seus estudos na nuvem</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mail</label>
                    <input type="email" id="auth-email" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Palavra-passe</label>
                    <input type="password" id="auth-password" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
                </div>
                
                <div id="auth-error" class="text-red-500 text-xs hidden"></div>

                <div class="flex gap-3 pt-2">
                    <button onclick="handleLogin()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">Entrar</button>
                    <button onclick="handleRegister()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 rounded-lg transition">Criar Conta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div id="app-content" class="hidden flex-1 flex flex-col">
        <!-- Barra Superior -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-xs">
            <div class="flex items-center gap-3">
                <span class="text-xl font-bold text-blue-600">Estratégia Concursos</span>
                <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium">Cloud Sync Ativo</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-sm text-slate-600 font-medium"></span>
                <button onclick="handleLogout()" class="text-sm text-red-600 hover:text-red-800 font-medium px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-50 transition">Sair</button>
            </div>
        </header>

        <!-- Área Central -->
        <main class="max-w-4xl w-full mx-auto p-6 space-y-6 flex-1">
            
            <!-- Painel de Upload e Matérias -->
            <div class="bg-white p-6 rounded-xl shadow-xs border border-slate-200 space-y-4">
                <h2 class="text-lg font-bold text-slate-800">Novo Material de Estudo</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome da Matéria / Aula</label>
                        <input type="text" id="subject-name" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: Direito Administrativo - Aula 01">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Selecionar PDF da Aula</label>
                        <input type="file" id="pdf-file-input" accept="application/pdf" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                </div>
                <div class="flex justify-end pt-2">
                    <button onclick="processPDF()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition flex items-center gap-2">
                        📥 Carregar e Processar PDF
                    </button>
                </div>
            </div>

            <!-- Filtros e Relatório de Desempenho -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200 text-center">
                    <span class="block text-xs uppercase font-bold text-slate-400">Total Questões</span>
                    <span id="stat-total" class="text-2xl font-bold text-slate-800">0</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200 text-center">
                    <span class="block text-xs uppercase font-bold text-blue-500">Respondidas</span>
                    <span id="stat-resolved" class="text-2xl font-bold text-blue-600">0</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200 text-center">
                    <span class="block text-xs uppercase font-bold text-emerald-500">Acertos</span>
                    <span id="stat-correct" class="text-2xl font-bold text-emerald-600">0</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200 text-center">
                    <span class="block text-xs uppercase font-bold text-purple-500">Aproveitamento</span>
                    <span id="stat-percent" class="text-2xl font-bold text-purple-600">0%</span>
                </div>
            </div>

            <!-- Barra de Controlo e Filtros -->
            <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex gap-2">
                    <button onclick="filterQuestions('all')" id="btn-filter-all" class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-50 text-blue-600 border border-blue-200">Todas</button>
                    <button onclick="filterQuestions('pending')" id="btn-filter-pending" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200">Não Resolvidas</button>
                    <button onclick="filterQuestions('resolved')" id="btn-filter-resolved" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200">Resolvidas</button>
                </div>
                <button onclick="saveDataToCloud()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition flex items-center gap-2">
                    💾 Guardar na Nuvem
                </button>
            </div>

            <!-- Lista de Questões -->
            <div id="questions-container" class="space-y-4">
                <div class="bg-white p-8 rounded-xl shadow-xs border border-slate-200 text-center text-slate-400">
                    Nenhum PDF carregado. Selecione um arquivo PDF acima para começar.
                </div>
            </div>
        </main>
    </div>

    <!-- Script da Aplicação -->
    <script>
        let currentUser = null;
        let appData = { questions: [] };
        let currentFilter = 'all';

        // Autenticação Firebase
        setTimeout(() => {
            if (window.firebaseAuth) {
                const { auth, onAuthStateChanged } = window.firebaseAuth;
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        document.getElementById('auth-screen').classList.add('hidden');
                        document.getElementById('app-content').classList.remove('hidden');
                        document.getElementById('user-display').innerText = user.email;
                        loadDataFromCloud();
                    } else {
                        currentUser = null;
                        document.getElementById('auth-screen').classList.remove('hidden');
                        document.getElementById('app-content').classList.add('hidden');
                    }
                });
            }
        }, 1000);

        async function handleLogin() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error');
            try {
                errEl.classList.add('hidden');
                await window.firebaseAuth.signInWithEmailAndPassword(window.firebaseAuth.auth, email, password);
            } catch (error) {
                errEl.innerText = "Erro ao entrar: " + error.message;
                errEl.classList.remove('hidden');
            }
        }

        async function handleRegister() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error');
            try {
                errEl.classList.add('hidden');
                await window.firebaseAuth.createUserWithEmailAndPassword(window.firebaseAuth.auth, email, password);
            } catch (error) {
                errEl.innerText = "Erro ao registar: " + error.message;
                errEl.classList.remove('hidden');
            }
        }

        async function handleLogout() {
            await window.firebaseAuth.signOut(window.firebaseAuth.auth);
        }

        async function saveDataToCloud() {
            if (!currentUser) return;
            try {
                const { db, doc, setDoc } = window.firebaseDb;
                await setDoc(doc(db, "users_data", currentUser.uid), appData);
                alert("Progresso guardado com sucesso na nuvem!");
            } catch (e) {
                console.error(e);
                alert("Erro ao guardar na nuvem.");
            }
        }

        async function loadDataFromCloud() {
            if (!currentUser) return;
            try {
                const { db, doc, getDoc } = window.firebaseDb;
                const docSnap = await getDoc(doc(db, "users_data", currentUser.uid));
                if (docSnap.exists()) {
                    appData = docSnap.data();
                    if (!appData.questions) appData.questions = [];
                    renderQuestions();
                    updateReport();
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Processamento de PDF
        async function processPDF() {
            const fileInput = document.getElementById('pdf-file-input');
            const subjectName = document.getElementById('subject-name').value.trim() || "Aula Geral";

            if (fileInput.files.length === 0) {
                alert("Por favor, selecione um arquivo PDF.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = "";

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(" ");
                        fullText += `\n--- PÁGINA ${i} ---\n` + pageText;
                    }

                    extractQuestionsSimple(fullText, subjectName);
                } catch (error) {
                    console.error(error);
                    alert("Erro ao ler o PDF.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // Extrator de Questões Baseado em Padrões de Concursos
        function extractQuestionsSimple(text, subject) {
            const regex = /(?:Questão|Q\.|)(\s*\d+[\.\-\)]\s*[\s\S]*?)(?=(?:Questão|Q\.|)(?:\s*\d+[\.\-\)]\s*)|$)/gi;
            let matches = [...text.matchAll(regex)];
            
            if (matches.length === 0) {
                // Fallback para divisão simples por blocos de texto se o regex complexo não encontrar
                let chunks = text.split(/(?=Questão\s*\d+)/i);
                if (chunks.length > 1) {
                    matches = chunks.map(c => [c, c]);
                }
            }

            appData.questions = [];
            let count = 1;

            matches.forEach((m) => {
                let qText = m[1] || m[0];
                if (qText.length > 30) {
                    appData.questions.push({
                        id: count++,
                        subject: subject,
                        text: qText.trim(),
                        selectedAnswer: null,
                        correctAnswer: 'C' // Padrão simulado para validação
                    });
                }
            });

            if (appData.questions.length === 0) {
                // Se não detetar automaticamente, cria uma questão de exemplo com o texto extraído
                appData.questions.push({
                    id: 1,
                    subject: subject,
                    text: text.substring(0, 1000) + "...",
                    selectedAnswer: null,
                    correctAnswer: 'C'
                });
            }

            renderQuestions();
            updateReport();
            saveDataToCloud();
            alert(`Processado com sucesso! ${appData.questions.length} itens encontrados.`);
        }

        function answerQuestion(id, option) {
            const q = appData.questions.find(item => item.id === id);
            if (q) {
                q.selectedAnswer = option;
                renderQuestions();
                updateReport();
            }
        }

        function filterQuestions(type) {
            currentFilter = type;
            ['all', 'pending', 'resolved'].forEach(t => {
                const btn = document.getElementById(`btn-filter-${t}`);
                if (t === type) {
                    btn.className = "px-4 py-2 text-sm font-medium rounded-lg bg-blue-50 text-blue-600 border border-blue-200";
                } else {
                    btn.className = "px-4 py-2 text-sm font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200";
                }
            });
            renderQuestions();
        }

        function updateReport() {
            const total = appData.questions.length;
            const resolved = appData.questions.filter(q => q.selectedAnswer !== null).length;
            const correct = appData.questions.filter(q => q.selectedAnswer === q.correctAnswer).length;
            const percent = resolved > 0 ? Math.round((correct / resolved) * 100) : 0;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-resolved').innerText = resolved;
            document.getElementById('stat-correct').innerText = correct;
            document.getElementById('stat-percent').innerText = percent + '%';
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";

            let filtered = appData.questions;
            if (currentFilter === 'pending') {
                filtered = appData.questions.filter(q => q.selectedAnswer === null);
            } else if (currentFilter === 'resolved') {
                filtered = appData.questions.filter(q => q.selectedAnswer !== null);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-xl shadow-xs border border-slate-200 text-center text-slate-400">Nenhuma questão encontrada para este filtro.</div>`;
                return;
            }

            filtered.forEach((q) => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-xl shadow-xs border border-slate-200 space-y-4";
                
                let optionsHtml = '';
                ['A', 'B', 'C', 'D', 'E'].forEach(opt => {
                    let btnClass = "px-4 py-2 border rounded-lg text-sm font-medium transition ";
                    if (q.selectedAnswer === opt) {
                        btnClass += "bg-blue-600 text-white border-blue-600";
                    } else {
                        btnClass += "bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100";
                    }
                    optionsHtml += `<button onclick="answerQuestion(${q.id}, '${opt}')" class="${btnClass}">${opt}</button>`;
                });

                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-slate-400 font-semibold uppercase">
                        <span>${q.subject} - Questão ${q.id}</span>
                        <span>${q.selectedAnswer ? 'Respondida' : 'Pendente'}</span>
                    </div>
                    <p class="text-slate-800 text-sm whitespace-pre-wrap leading-relaxed">${q.text}</p>
                    <div class="flex gap-3 pt-2">
                        ${optionsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
