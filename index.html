<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Estudos - Concursos</title>
    <!-- Tailwind CSS para um design limpo e moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9k7aqcBb2dVMVMA6zp0PAN6rLvADReaI",
            authDomain: "questoes-b0c0b.firebaseapp.com",
            projectId: "questoes-b0c0b",
            storageBucket: "questoes-b0c0b.firebasestorage.app",
            messagingSenderId: "194950212696",
            appId: "1:194950212696:web:b4b59dbf93460088056e2d",
            measurementId: "G-8H53FTS93Y"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expor funções e variáveis globalmente para o script da página
        window.firebaseAuth = { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged };
        window.firebaseDb = { db, doc, setDoc, getDoc };
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Tela de Login / Registo -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold text-slate-900">Portal de Estudos</h1>
                <p class="text-sm text-slate-500">Faça login para sincronizar o seu progresso na nuvem</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mail</label>
                    <input type="email" id="auth-email" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Palavra-passe</label>
                    <input type="password" id="auth-password" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
                </div>
                
                <div id="auth-error" class="text-red-500 text-xs hidden"></div>

                <div class="flex gap-3 pt-2">
                    <button onclick="handleLogin()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">Entrar</button>
                    <button onclick="handleRegister()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 rounded-lg transition">Criar Conta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Conteúdo Principal do Aplicativo -->
    <div id="app-content" class="hidden flex-1 flex flex-col">
        <!-- Barra Superior -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-xs">
            <div class="flex items-center gap-3">
                <span class="text-xl font-bold text-blue-600">Estratégia Concursos</span>
                <span class="text-xs bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full font-medium">Cloud Sync Ativo</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-sm text-slate-600"></span>
                <button onclick="handleLogout()" class="text-sm text-red-600 hover:text-red-800 font-medium px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-50 transition">Sair</button>
            </div>
        </header>

        <!-- Área Central -->
        <main class="max-w-4xl w-full mx-auto p-6 space-y-6 flex-1">
            <!-- Gestão e Filtros -->
            <div class="bg-white p-6 rounded-xl shadow-xs border border-slate-200 space-y-4">
                <h2 class="text-lg font-bold text-slate-800">Painel de Controlo de Estudos</h2>
                <div class="flex flex-wrap gap-4 items-center justify-between">
                    <div class="flex gap-2">
                        <button onclick="filterQuestions('all')" class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-50 text-blue-600 border border-blue-200">Todas</button>
                        <button onclick="filterQuestions('pending')" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200">Não Resolvidas</button>
                        <button onclick="filterQuestions('resolved')" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200">Resolvidas</button>
                    </div>
                    <button onclick="saveDataToCloud()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition flex items-center gap-2">
                        💾 Guardar na Nuvem
                    </button>
                </div>
            </div>

            <!-- Relatório de Desempenho -->
            <div id="report-section" class="bg-white p-6 rounded-xl shadow-xs border border-slate-200 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
                    <span class="block text-xs uppercase font-bold text-slate-400">Total</span>
                    <span id="stat-total" class="text-2xl font-bold text-slate-800">0</span>
                </div>
                <div class="p-4 bg-blue-50 rounded-lg border border-blue-100">
                    <span class="block text-xs uppercase font-bold text-blue-400">Respondidas</span>
                    <span id="stat-resolved" class="text-2xl font-bold text-blue-600">0</span>
                </div>
                <div class="p-4 bg-emerald-50 rounded-lg border border-emerald-100">
                    <span class="block text-xs uppercase font-bold text-emerald-400">Acertos</span>
                    <span id="stat-correct" class="text-2xl font-bold text-emerald-600">0</span>
                </div>
                <div class="p-4 bg-purple-50 rounded-lg border border-purple-100">
                    <span class="block text-xs uppercase font-bold text-purple-400">Aproveitamento</span>
                    <span id="stat-percent" class="text-2xl font-bold text-purple-600">0%</span>
                </div>
            </div>

            <!-- Área de Questões (Simulador) -->
            <div id="questions-container" class="space-y-4">
                <div class="bg-white p-6 rounded-xl shadow-xs border border-slate-200 text-center text-slate-500">
                    Nenhum PDF carregado ou questões disponíveis de momento.
                </div>
            </div>
        </main>
    </div>

    <!-- Script de Gestão da Aplicação -->
    <script>
        let currentUser = null;
        let userAppData = { questions: [] };

        // Aguardar o carregamento do Firebase Auth
        setTimeout(() => {
            if (window.firebaseAuth) {
                const { auth, onAuthStateChanged } = window.firebaseAuth;
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        document.getElementById('auth-screen').classList.add('hidden');
                        document.getElementById('app-content').classList.remove('hidden');
                        document.getElementById('user-display').innerText = user.email;
                        loadDataFromCloud();
                    } else {
                        currentUser = null;
                        document.getElementById('auth-screen').classList.remove('hidden');
                        document.getElementById('app-content').classList.add('hidden');
                    }
                });
            }
        }, 1000);

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error');
            try {
                errEl.classList.add('hidden');
                await window.firebaseAuth.signInWithEmailAndPassword(window.firebaseAuth.auth, email, password);
            } catch (error) {
                errEl.innerText = "Erro ao entrar: " + error.message;
                errEl.classList.remove('hidden');
            }
        }

        async function handleRegister() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error');
            try {
                errEl.classList.add('hidden');
                await window.firebaseAuth.createUserWithEmailAndPassword(window.firebaseAuth.auth, email, password);
            } catch (error) {
                errEl.innerText = "Erro ao registar: " + error.message;
                errEl.classList.remove('hidden');
            }
        }

        async function handleLogout() {
            await window.firebaseAuth.signOut(window.firebaseAuth.auth);
        }

        async function saveDataToCloud() {
            if (!currentUser) return;
            try {
                const { db, doc, setDoc } = window.firebaseDb;
                await setDoc(doc(db, "users_data", currentUser.uid), userAppData);
                alert("Progresso guardado na nuvem com sucesso!");
            } catch (e) {
                console.error(e);
                alert("Erro ao guardar na nuvem.");
            }
        }

        async function loadDataFromCloud() {
            if (!currentUser) return;
            try {
                const { db, doc, getDoc } = window.firebaseDb;
                const docSnap = await getDoc(doc(db, "users_data", currentUser.uid));
                if (docSnap.exists()) {
                    userAppData = docSnap.data();
                    updateReport();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function updateReport() {
            const total = userAppData.questions.length;
            const resolved = userAppData.questions.filter(q => q.selectedAnswer).length;
            const correct = userAppData.questions.filter(q => q.selectedAnswer === q.correctAnswer).length;
            const percent = resolved > 0 ? Math.round((correct / resolved) * 100) : 0;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-resolved').innerText = resolved;
            document.getElementById('stat-correct').innerText = correct;
            document.getElementById('stat-percent').innerText = percent + '%';
        }

        function filterQuestions(type) {
            // Lógica de filtragem futura integrada ao painel
        }
    </script>
</body>
</html>
