<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Concursos">
<meta name="theme-color" content="#1e293b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Estudos para Concursos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--txt:#1d2433;--mut:#6b7488;--pri:#3b5bdb;--ok:#2f9e44;--err:#e03131;--bd:#dde2ec}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b202b;--txt:#e8ecf4;--mut:#9aa3b5;--bd:#2c3342}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:14px 20px;background:var(--pri);color:#fff}
h1{margin:0;font-size:1.3rem}
.layout{display:flex;flex-wrap:wrap;gap:16px;padding:16px;max-width:1100px;margin:auto}
aside{flex:1 1 220px;max-width:280px}
main{flex:3 1 380px;min-width:0}
input,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--txt)}
input[type=text],#novaMateria{width:100%;margin-bottom:6px}
button{cursor:pointer}
button.pri{background:var(--pri);color:#fff;border:0;font-weight:600}
form button{width:100%}
.mat{display:flex;gap:4px;margin-bottom:6px}
.mat .nome{flex:1;text-align:left}
.mat .nome.on,.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.alt{display:block;padding:7px 8px;border-radius:8px;cursor:pointer}
.alt:hover{background:var(--bg)}
.q.ok{border-left:5px solid var(--ok)}
.q.err{border-left:5px solid var(--err)}
.q.branco{border-left:5px solid #f08c00}
.fb{margin:8px 0 0;font-weight:600}
.ok .fb{color:var(--ok)}.err .fb{color:var(--err)}
.muted{color:var(--mut);font-size:.9rem}
.stats{display:flex;flex-wrap:wrap;gap:12px;text-align:center}
.stats div{flex:1 1 90px}.stats b{display:block;font-size:1.6rem}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok)}

/* ---- v2: filtros, relatório e gráficos ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.chip{padding:5px 10px;border-radius:999px;font-size:.9rem}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#de,#ate{width:75px}
.mini{float:right;padding:3px 8px;font-size:.8rem}
.q.pend{border-left:5px solid #f08c00}
button.pri:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex}.bar i{display:block;height:100%}
.bar.big{height:16px}
.bar .s-acerto,.dot.s-acerto{background:var(--ok)}
.bar .s-erro,.dot.s-erro{background:var(--err)}
.bar .s-pendente,.dot.s-pendente{background:#f08c00}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px}
.brow{display:grid;grid-template-columns:60px 1fr 45px;gap:8px;align-items:center;margin:4px 0;font-size:.85rem}
.brow .bar{margin:0}
summary{cursor:pointer}
#refazer{margin-top:10px}
aside .btn{display:block;text-align:center;margin-top:6px;cursor:pointer}
aside .btn{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
/* ---- v3: abas, lista de PDFs, login ---- */
[hidden]{display:none!important}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
#conta{display:flex;gap:10px;align-items:center;font-size:.9rem}
.wrap{max-width:920px;margin:auto;padding:16px}
.center{text-align:center;max-width:420px;margin:40px auto}
#abas{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;border-bottom:2px solid var(--bd)}
#abas .tab{white-space:nowrap;border-radius:10px 10px 0 0}
#abas .tab.add{border-style:dashed}
.row-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row-head h2{margin:0}
.pdfrow{display:flex;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--bd);cursor:pointer}
.pdfrow:hover{background:var(--bg)}
.pdfrow.on{background:var(--bg);border-left:4px solid var(--pri)}
.pdfrow .nm{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
/* ---- v4: iOS, afirmativas, riscar alternativas ---- */
header{background:#1e293b;padding-top:calc(14px + env(safe-area-inset-top))}
.wrap{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.afirm{list-style:none;padding:0 0 0 8px;margin:8px 0}
.afirm li{margin:6px 0}
.enun p{margin:6px 0}
.altrow{display:flex;align-items:flex-start;gap:6px}
.altrow .alt{flex:1}
.cut-btn{padding:3px 7px;font-size:.85rem;opacity:.6;margin-top:4px}
.altrow.cut .cut-btn{opacity:1;background:var(--bd)}
.altrow.cut .alt{text-decoration:line-through;opacity:.4}
.stat{font-size:.85rem;color:var(--mut);white-space:nowrap;background:var(--bg);padding:3px 8px;border-radius:999px}
#formLogin input:not([type=checkbox]){width:100%;margin-bottom:8px}
#formLogin button{width:100%;margin-top:6px}
.lembrar{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0;font-size:.9rem}
button.link{border:0;background:none;color:var(--pri);text-decoration:underline}
.erro{color:var(--err);min-height:1.2em;font-size:.9rem}
/* ---- v5: menu lateral, conteúdo, cronograma ---- */
#app{display:flex;max-width:1150px;margin:auto}
#menu{flex:0 0 160px;position:sticky;top:0;align-self:flex-start;display:flex;flex-direction:column;gap:6px;padding:16px 8px 16px 12px}
.mi{display:flex;align-items:center;gap:8px;text-align:left;padding:12px}
.mi.on{background:#1e293b;color:#fff;border-color:#1e293b}
.conteudo{flex:1;min-width:0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.conteudo h2{margin-top:0}
.tab.add{border-style:dashed}
.crow{display:grid;grid-template-columns:1.4fr 1fr 1fr 40px;gap:6px;margin-bottom:6px;align-items:center}
.crow input{width:100%;min-width:0}
.crow.head{font-size:.8rem;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:4px 6px 4px 12px}
.pill button{border:0;padding:0 6px;background:none}
.dia.hoje{border-left:5px solid var(--pri)}
.dia select,select.sel{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--txt);width:100%;margin-top:8px}
@media(max-width:640px){
  #menu{flex-basis:64px;padding:12px 4px 12px 8px}
  .mi{flex-direction:column;gap:2px;padding:8px 2px;font-size:.62rem;text-align:center;justify-content:center}
  .mi .ic{font-size:1.4rem}
  .conteudo{padding:12px 8px}
  .crow{grid-template-columns:1fr 1fr 40px}.crow input:first-child{grid-column:1/-1}.crow.head{display:none}
}
/* ---- v6: visual profissional (Conteúdo / Cronograma) ---- */
:root{--sh:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06);--sl:#1e293b}
@media(max-width:640px){input,select{font-size:16px}} /* evita zoom automático no iPhone */
.ctop{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.ctop h2{margin:0 0 4px}
.savechip{font-size:.78rem;color:var(--mut);background:var(--card);border:1px solid var(--bd);padding:3px 10px;border-radius:999px}
.addbig{flex:1 1 240px;max-width:340px;padding:14px 18px;font-size:1rem;font-weight:700;border:0;border-radius:14px;color:#fff;
  background:linear-gradient(135deg,#3b5bdb,#1e293b);box-shadow:0 8px 18px rgba(59,91,219,.35)}
.addbig:active{transform:scale(.98)}
.secblock{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:14px;margin-bottom:18px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-left:10px;border-left:5px solid #3b5bdb;font-size:1.05rem}
.secblock.passe .sechead{border-left-color:#f59f00}
.count{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:1px 10px;font-size:.8rem;color:var(--mut)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px}
.mtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mdot{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;
  background:hsl(var(--h) 80% 92%);color:hsl(var(--h) 55% 30%)}
.mnome{flex:1;min-width:0;font-weight:700;border:0;border-bottom:1.5px solid transparent;background:transparent;border-radius:0;padding:6px 2px}
.mnome:focus{outline:0;border-bottom-color:var(--pri)}
.ico{border:0;background:none;padding:6px;opacity:.65}
.mfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.fld label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:4px}
.fld input{width:100%;padding:10px 12px;border-radius:10px}
.fld input:focus{outline:2px solid var(--pri);outline-offset:0}
.addsec{width:100%;margin-top:12px;padding:11px;border:1.5px dashed var(--bd);background:transparent;color:var(--mut);border-radius:12px;font-weight:600}
/* Cronograma */
.kbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);
  border-radius:16px;box-shadow:var(--sh);padding:10px 12px;margin-bottom:16px}
.kbar .tabs{flex:1 1 220px;flex-wrap:nowrap;overflow-x:auto;margin:0;padding-bottom:2px}
.kbar .tab{white-space:nowrap;border-radius:999px}
.kact{display:flex;gap:6px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.kdia{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.khead{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--bd)}
.khead b{flex:1;font-size:1.02rem}
.kico{font-size:1.2rem}
.kcount{font-size:.75rem;color:var(--mut)}
.tag{background:#facc15;color:var(--sl);font-size:.65rem;font-weight:800;padding:2px 8px;border-radius:999px}
.kdia.hoje{box-shadow:0 0 0 2px var(--pri),0 10px 26px rgba(59,91,219,.25)}
.kdia.hoje .khead{background:linear-gradient(135deg,#3b5bdb,#1e293b);color:#fff;border-bottom:0}
.kdia.hoje .kcount{color:#cbd5e1}
.kdia.descanso{background:var(--bg);border-style:dashed;box-shadow:none}
.kdia.descanso .khead{background:transparent;border-bottom:0}
.kbody{padding:12px 14px 14px}
.kbody .chips{gap:8px;margin-bottom:0}
.kbody .muted{margin:0}
.kdia .pill{background:hsl(var(--h) 80% 93%);border:1px solid hsl(var(--h) 60% 80%);color:hsl(var(--h) 55% 25%);font-weight:600;font-size:.88rem}
.kdia .pill button{color:inherit;opacity:.7}
.kdia select{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1.5px dashed var(--bd);background:transparent;color:var(--mut);font:inherit;text-align:center}
@media(prefers-color-scheme:dark){
  .mdot{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 85%)}
  .kdia .pill{background:hsl(var(--h) 35% 22%);border-color:hsl(var(--h) 35% 32%);color:hsl(var(--h) 70% 88%)}
}
dialog{border:0;border-radius:18px;padding:18px;background:var(--card);color:var(--txt);width:min(92vw,380px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,23,42,.55)}
dialog h3{margin:0 0 12px}
dialog input,dialog select{width:100%;margin-bottom:8px;padding:11px 12px;border-radius:10px;font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
/* ---- v7: IA + diagnóstico ---- */
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.qbtns{display:flex;gap:6px;flex-wrap:wrap}
.qbtns .mini{float:none}
.ia-btn{background:linear-gradient(135deg,#10a37f,#0b7a5e);color:#fff;border:0;font-weight:700;border-radius:10px;padding:7px 12px;font-size:.85rem;box-shadow:0 3px 10px rgba(16,163,127,.35)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.foco{border-radius:14px;padding:12px 14px;margin-bottom:12px;background:rgba(245,159,0,.12);border:1px solid rgba(245,159,0,.45)}
.foco.ok{background:rgba(47,158,68,.12);border-color:rgba(47,158,68,.45)}
.foco.nd{background:var(--bg);border-color:var(--bd)}
.focoitem{margin-top:8px;padding-left:10px;border-left:4px solid #f08c00;font-size:.92rem}
.focoitem.alto{border-left-color:var(--err)}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.drow{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px}
.dtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.nvb{font-size:.75rem;font-weight:700}
.dap{font-size:.82rem;margin-top:6px}
.bar .s-alto{background:var(--err)}.bar .s-med{background:#f08c00}.bar .s-ok{background:var(--ok)}.bar .s-nd{background:var(--bd)}
/* ---- v8: IA na tela + renomear ---- */
.iabody{white-space:pre-wrap;max-height:58vh;overflow:auto;line-height:1.55;margin:10px 0;padding-right:4px;-webkit-overflow-scrolling:touch}
.iabody h4{margin:12px 0 2px}
.pdfrow button{padding:4px 8px}
/* ---- v10: questões elegantes + cartão do professor ---- */
.card.q{background:#fcfdff;color:#2d3748;border-radius:18px;padding:18px 18px 16px;box-shadow:var(--sh);margin-bottom:16px}
.qnum{font-weight:800;font-size:1.05rem}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.badge{font-size:.7rem;font-weight:600;letter-spacing:.03em;padding:3px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--mut)}
.badge.banca{background:rgba(59,91,219,.10);border-color:rgba(59,91,219,.28);color:#3b5bdb}
.badge.ano{background:rgba(245,159,0,.12);border-color:rgba(245,159,0,.35);color:#b36b00}
.badge.orgao{background:rgba(18,184,134,.12);border-color:rgba(18,184,134,.35);color:#0b7a5e}
.badge.mat{background:rgba(112,72,232,.10);border-color:rgba(112,72,232,.28);color:#5f3dc4}
.enun{font-size:1.03rem;line-height:1.8;max-width:72ch;margin-bottom:14px}
.enun p{margin:8px 0}
.afirm li{line-height:1.7;padding:2px 0}
.alts{display:flex;flex-direction:column;gap:8px}
.altrow{display:flex;align-items:flex-start;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);transition:border-color .15s,background .15s}
.altrow:hover{border-color:#b6c2e8}
.altrow:focus-within{box-shadow:0 0 0 3px rgba(59,91,219,.25)}
.altrow .alt{flex:1;display:flex;gap:12px;align-items:flex-start;padding:12px 6px 12px 14px;cursor:pointer;position:relative;min-width:0;text-decoration:none;opacity:1}
.altrow .alt:hover{background:transparent}
.alt input{position:absolute;opacity:0;pointer-events:none}
.letra{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--bg);border:1.5px solid var(--bd);color:var(--mut)}
.atxt{flex:1;line-height:1.6;overflow-wrap:anywhere;padding-top:2px}
.altrow.sel{border-color:var(--pri);background:rgba(59,91,219,.07)}
.altrow.sel .letra{background:var(--pri);border-color:var(--pri);color:#fff}
.altrow.certa{border-color:var(--ok);background:rgba(47,158,68,.10)}
.altrow.certa .letra{background:var(--ok);border-color:var(--ok);color:#fff}
.altrow.errada{border-color:var(--err);background:rgba(224,49,49,.08)}
.altrow.errada .letra{background:var(--err);border-color:var(--err);color:#fff}
.altrow.cut{background:var(--bg);border-style:dashed}
.altrow.cut .atxt{text-decoration:line-through;opacity:.5}
.altrow.cut .letra{opacity:.5}
.cut-btn{border:0;background:transparent;margin:8px 8px 0 0;padding:4px 6px;opacity:.5;border-radius:8px}
.altrow.cut .cut-btn{opacity:1;background:var(--bd)}
.iabox{margin-top:14px;border-radius:16px;border:1px solid #f0dfbd;background:#fffaf0;overflow:hidden;box-shadow:var(--sh);color:#2d3748}
.iahead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:rgba(245,159,0,.12);border-bottom:1px solid rgba(245,159,0,.25);color:inherit}
.iatitle{display:flex;align-items:center;gap:10px}
.iaav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid rgba(245,159,0,.4);font-size:1.1rem}
.iatitle small{display:block;color:#6b7488;font-size:.72rem}
.iabtns{display:flex;gap:4px;flex-wrap:wrap}
.iahead button{padding:3px 9px;font-size:.8rem;background:var(--card);color:var(--txt);border:1px solid var(--bd);border-radius:8px}
.iabox .iabody{max-height:none;overflow:visible;margin:0;padding:6px 14px 14px;white-space:normal;line-height:1.65}
.isec{margin:10px 0;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.75);border-left:4px solid var(--bd)}
.isec.ok{border-left-color:var(--ok)}
.isec.warn{border-left-color:#f08c00;background:rgba(245,159,0,.10)}
.isec.info{border-left-color:var(--pri)}
.isec.law{border-left-color:#7048e8}
.isec h4{margin:0 0 6px;font-size:.98rem;color:inherit}
.isb{white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere}
@media(prefers-color-scheme:dark){
  .card.q{background:#1a2030;color:#dde3ee}
  .badge.banca{color:#9db4ff}.badge.ano{color:#ffd27a}.badge.orgao{color:#6fe0bd}.badge.mat{color:#c3b0ff}
  .iabox{background:#222a3a;border-color:#3a4660;color:#dde3ee}
  .iaav{background:#2d3750}
  .isec{background:rgba(255,255,255,.04)}
}
/* ================= v11: UI de elite (glassmorphism, profundidade, micro-interações) ================= */
:root{--glass:rgba(255,255,255,.72);--glass-s:rgba(255,255,255,.92);--line:rgba(148,163,184,.28);
  --sh-s:0 1px 2px rgba(15,23,42,.05),0 10px 30px -10px rgba(15,23,42,.16);
  --sh-l:0 2px 4px rgba(15,23,42,.06),0 22px 46px -14px rgba(15,23,42,.28);--ease:cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:dark){:root{--glass:rgba(27,32,43,.72);--glass-s:rgba(27,32,43,.94);--line:rgba(148,163,184,.18);
  --sh-s:0 1px 2px rgba(0,0,0,.3),0 10px 30px -10px rgba(0,0,0,.55);--sh-l:0 2px 4px rgba(0,0,0,.35),0 22px 46px -14px rgba(0,0,0,.7)}}
body{font-family:ui-sans-serif,-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 520px at 8% -8%,rgba(59,91,219,.16),transparent 60%),radial-gradient(900px 480px at 100% 0,rgba(112,72,232,.12),transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3,h4{letter-spacing:-.015em}
header{background:linear-gradient(135deg,#1e293b,#243049);box-shadow:0 6px 24px -10px rgba(15,23,42,.6)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px rgba(59,91,219,.18)}

// Cache offline: continua funcionando sem internet e sincroniza depois
const fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- Estado ----------
let user = null, materias = [], listas = [], unsubs = [];
const ui0 = JSON.parse(localStorage.getItem("ui_estudos") || "{}"); // preferências de tela (por aparelho)
let sel = { materia: ui0.materia || null, lista: ui0.lista || null };
let filtro = ui0.filtro || "todas";
let secao = ui0.secao || "questoes", subC = "regular";
let faixa = ui0.faixa || { de: 1, ate: 9999 };

const ref = (n, id) => doc(fs, "users", user.uid, n, id);

// Ordem alfabética natural (Aula 2 antes de Aula 10, ignora acentos/maiúsculas)
const alfa = (a, b) => a.nome.localeCompare(b.nome, "pt-BR", { numeric: true, sensitivity: "base" });

const statTxt = (l) => { // ex.: "12/87 resp. • 75%"
  const c = contar(l, l.questoes), tot = l.questoes.length, cor = c.acerto + c.erro;
  return `${tot - c.branco}/${tot} resp. • ${cor ? Math.round((c.acerto / cor) * 100) + "%" : "—"}`;
};
const atualizarLinha = (L) => { const e = document.querySelector(`[data-stat="${L.id}"]`); if (e) e.textContent = statTxt(L); };
let exibidas = []; // números das questões que estão na tela agora
const pendentesTela = (L) => L.questoes.filter((q) => exibidas.includes(q.num) && status(L, q) === "pendente");
// Atualiza o botão inferior em tempo real (contador e habilitação)
function atualizarBotao(L) {
  const b = $("corrigir"); if (!b) return;
  const n = pendentesTela(L).length;
  b.textContent = `✅ Corrigir questões marcadas (${n})`;
  b.disabled = !(n && Object.keys(L.gabarito).length);
}
const sig = (ls) => ls.map((L) => [L.id, L.nome, L.materia, L.questoes.length,
  Object.entries(L.respostas || {}).sort().join(), Object.keys(L.corrigidas || {}).sort().join(), Object.entries(L.riscadas || {}).sort().join(), Object.keys(L.ia || {}).sort().join()].join("~")).join("|");

// ---------- Leitura de PDF / questões / relatório (reaproveitados) ----------
// ---------- Extração do PDF ----------
const LIXO = new RegExp([
  "www\\.", "https?:", "t\\.me", "telegram", "estrat[eé]gia\\s+concursos",
  "p[aá]gina\\s+\\d+", "^\\s*\\d+\\s*(de|/)\\s*\\d+\\s*$",   // numeração de páginas
  ",\\s*equipe\\s", "^\\s*aula\\s+\\d+",                       // "Fulano, Equipe Direito X  Aula 07 ..."
  "direitos?\\s+autorais?", "proibida\\s+a\\s+reprodu", "9\\.610", "licenciado",
  "\\bcpf\\b", "\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}", "^\\s*prof\\."
].join("|"), "i");
const chaveLinha = (l) => l.toLowerCase().replace(/\d+/g, "#").replace(/\s+/g, " ").trim();

// Limpeza final do texto (links, assinatura de rodapé, "Página N") — também aplicada ao exibir
function limpar(t) {
  return t
    .replace(/https?:\/\/\S+|t\.me\/\S+|www\.\S+/gi, " ")
    .replace(/[A-ZÀ-Ú][\wÀ-ú.]+(?:\s[A-ZÀ-Ú][\wÀ-ú.]+){0,1},\s*Equipe\s[\wÀ-ú ]{3,60}?\sAula\s\d+(?:\s[A-ZÀ-Ú0-9\-.()\/]{2,}){0,3}/g, " ")
    .replace(/\bP[aá]gina\s+\d+(\s+de\s+\d+)?/gi, " ")
    .replace(/\s{2,}/g, " ").trim();
}
// Gabarito: "1. C", "2 - A", "3: Certo", "4) ANULADA"...
const PAD_GAB = /(?<!\d)(\d{1,3})\s*[.\-–:)]?\s*(ANULAD[AO]|CERTO|ERRADO|[A-E])(?![A-Za-zÀ-ú])/g;

async function extrairTexto(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const paginas = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    const linhas = [];
    let linha = "", y = null;
    for (const it of tc.items) {
      const yy = it.transform[5];
      if (y !== null && Math.abs(yy - y) > 3) { linhas.push(linha); linha = ""; } // nova linha
      linha += it.str;
      y = yy;
    }
    linhas.push(linha);
    paginas.push(linhas.map((l) => l.trim()).filter(Boolean));
  }
  // Rodapés/cabeçalhos/marcas d'água se repetem em várias páginas (ignorando números): descarta
  const cont = new Map();
  paginas.forEach((ls) => new Set(ls.map(chaveLinha)).forEach((k) => cont.set(k, (cont.get(k) || 0) + 1)));
  const limite = Math.max(3, Math.ceil(paginas.length * 0.3));
  const lixo = (l) => !/gabarito/i.test(l) && (LIXO.test(l) || (chaveLinha(l).length >= 8 && cont.get(chaveLinha(l)) >= limite));
  return paginas.map((ls) => ls.filter((l) => !lixo(l)).join("\n")).join("\n");
}

const norm = (r) => {
  r = r.toUpperCase();
  return r === "CERTO" ? "C" : r === "ERRADO" ? "E" : r.startsWith("ANULAD") ? "ANULADA" : r;
};

function lerGabarito(t) {
  const g = {};
  for (const m of t.replace(/\s+/g, " ").matchAll(PAD_GAB)) {
    const n = +m[1];
    if (!(n in g)) g[n] = norm(m[2]);
  }
  return g;
}

// Testa cada "GABARITO" e escolhe a ocorrência com maior sequência 1,2,3...
function extrairGabarito(texto) {
  let best = { g: {}, pos: texto.length }, bestRun = 0;
  for (const m of texto.matchAll(/gabarito/gi)) {
    const g = lerGabarito(texto.slice(m.index + m[0].length));
    let r = 0;
    while (r + 1 in g) r++;
    if (r > bestRun) { bestRun = r; best = { g, pos: m.index }; }
  }
  return best;
}

// Divide por "1.", "2.", ... aceitando só o número esperado na sequência
function dividirQuestoes(texto) {
  let ach = [], esp = 1;
  for (const m of texto.matchAll(/^[ \t]*(\d{1,3})[ \t]*[.)][ \t]+(?=\S)/gm)) {
    const n = +m[1];
    if (n === 1 && ach.length < 3) { ach = []; esp = 1; } // ignora sumário
    if (n === esp) { ach.push({ n, ini: m.index, fim: m.index + m[0].length }); esp++; }
  }
  return ach.map((a, i) => ({ n: a.n, bloco: texto.slice(a.fim, i + 1 < ach.length ? ach[i + 1].ini : texto.length) }));
}

// Separa enunciado e alternativas a) b) c) d) e); sem alternativas => Certo/Errado
function parsearQuestao(num, bloco) {
  bloco = limpar(bloco.trim().replace(/\s*\n\s*/g, " "));
  const marcas = [...bloco.matchAll(/(?:^|\s)\(?([a-eA-E])\)\s/g)]
    .map((m) => ({ l: m[1].toUpperCase(), ini: m.index, fim: m.index + m[0].length }));
  // Última ocorrência de cada letra (as alternativas vêm depois do enunciado); vale a letra, não a posição
  const ultima = {};
  marcas.forEach((m) => { ultima[m.l] = m; });
  const seq = Object.values(ultima).sort((a, b) => a.ini - b.ini); // ordem em que aparecem no texto
  if (seq.length >= 2) {
    const bruto = {};
    seq.forEach((s, k) => { bruto[s.l] = bloco.slice(s.fim, k + 1 < seq.length ? seq[k + 1].ini : bloco.length).trim(); });
    const alt = {};
    Object.keys(bruto).sort().forEach((k) => (alt[k] = bruto[k])); // A, B, C, D, E
    return { num, tipo: "ME", enunciado: bloco.slice(0, seq[0].ini).trim(), alternativas: alt };
  }
  return { num, tipo: "CE", enunciado: bloco, alternativas: { C: "Certo", E: "Errado" } };
}

const ROM = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
const FIM_AFIRM = /(?<=[.;!?])\s+(?=(?:Est[aã]o|Est[aá]|Assinale|Marque|Indique|Julgue|Considerando|Com base|Analise|[EÉ] correto|Somente|Apenas|Quais|Qual)\b)/;
// Detecta I., II., III... (em sequência) no texto corrido e separa em linhas
function htmlEnunciado(txt) {
  txt = limpar(txt);
  const ms = []; let e = 0;
  for (const m of txt.matchAll(/(?:^|\s)(VIII|VII|VI|IV|IX|III|II|I|V|X)\s*[.)\-–]\s+(?=\S)/g)) {
    if (m[1] === "I" && e < 2) { ms.length = 0; e = 0; } // reinicia se ainda não fechou I, II
    if (m[1] === ROM[e]) { ms.push({ r: m[1], ini: m.index, fim: m.index + m[0].length }); e++; }
  }
  if (ms.length < 2) return `<p>${esc(txt)}</p>`;
  const intro = txt.slice(0, ms[0].ini).trim();
  let resto = "";
  const itens = ms.map((x, k) => {
    let t = txt.slice(x.fim, k + 1 < ms.length ? ms[k + 1].ini : txt.length).trim();
    if (k === ms.length - 1) { const q = t.search(FIM_AFIRM); if (q > 0) { resto = t.slice(q).trim(); t = t.slice(0, q).trim(); } } // "Estão corretas..."
    return `<li><b>${x.r}.</b> ${esc(t)}</li>`;
  });
  return (intro ? `<p>${esc(intro)}</p>` : "") + `<ul class="afirm">${itens.join("")}</ul>` + (resto ? `<p>${esc(resto)}</p>` : "");
}

async function processarPDF(file) {
  const texto = await extrairTexto(file);
  const { g, pos } = extrairGabarito(texto);
  const questoes = dividirQuestoes(texto.slice(0, pos)).map((q) => parsearQuestao(q.n, q.bloco));
  return { id: Date.now() + Math.random().toString(36).slice(2, 6), nome: file.name.replace(/\.pdf$/i, ""), questoes, gabarito: g, respostas: {}, corrigidas: {} };
}

// ---------- Interface ----------
const TAM = 20; // tamanho dos blocos (chips e gráfico por bloco)
const FILTROS = [["todas", "Todas"], ["nao", "Não resolvidas"], ["res", "Resolvidas"], ["erro", "Erradas"]];

// Estado: branco | pendente (marcada, ainda não corrigida) | acerto | erro | anulada
function status(L, q) {
  const m = L.respostas[q.num], c = L.gabarito[q.num];
  if (!m) return "branco";
  if (!L.corrigidas[q.num]) return "pendente";
  if (!c || c === "ANULADA") return "anulada";
  return m === c ? "acerto" : "erro";
}

// Questões exibidas conforme bloco (de/até) e filtro
function visiveis(L) {
  return L.questoes.filter((q) => {
    if (q.num < faixa.de || q.num > faixa.ate) return false;
    const s = status(L, q);
    return filtro === "todas" || (filtro === "nao" && s === "branco") ||
      (filtro === "res" && s !== "branco") || (filtro === "erro" && s === "erro");
  });
}

const seg = (c, t) => ["acerto", "erro", "pendente"].map((k) => `<i class="s-${k}" style="width:${(c[k] / t) * 100}%"></i>`).join("");
const contar = (L, qs) => { const c = { acerto: 0, erro: 0, pendente: 0, branco: 0, anulada: 0 }; qs.forEach((q) => c[status(L, q)]++); return c; };

// Relatório de desempenho (atualiza em tempo real)
function relatorio(L) {
  const total = L.questoes.length, c = contar(L, L.questoes);
  const corr = c.acerto + c.erro, pct = corr ? (c.acerto / corr) * 100 : 0;
  const pctTotal = (c.acerto / (total - c.anulada || 1)) * 100;
  let blocos = "";
  for (let s = 1; s <= L.questoes[total - 1].num; s += TAM) {
    const qs = L.questoes.filter((q) => q.num >= s && q.num < s + TAM);
    if (!qs.length) continue;
    const b = contar(L, qs), bc = b.acerto + b.erro;
    blocos += `<div class="brow"><span>${s}–${qs[qs.length - 1].num}</span><div class="bar">${seg(b, qs.length)}</div>
      <span>${bc ? Math.round((b.acerto / bc) * 100) + "%" : "—"}</span></div>`;
  }
  return `<details class="card" open><summary><b>📊 Relatório de desempenho</b></summary>
    <div class="stats"><div><b>${total}</b>Questões</div><div><b>${total - c.branco}</b>Respondidas</div>
    <div><b>${c.branco}</b>Em branco</div><div><b>${c.acerto}</b>Acertos</div><div><b>${c.erro}</b>Erros</div>
    <div><b>${pct.toFixed(1)}%</b>Aproveitamento</div></div>
    <p class="muted">Aproveitamento = acertos ÷ questões corrigidas (${corr}). Sobre o total da lista: ${pctTotal.toFixed(1)}%.
    ${c.pendente ? `${c.pendente} marcada(s) aguardando correção.` : ""}</p>
    <div class="bar big">${seg(c, total)}</div>
    <p class="muted"><i class="dot s-acerto"></i>Acertos <i class="dot s-erro"></i>Erros <i class="dot s-pendente"></i>Marcadas (não corrigidas) · cinza = em branco</p>
    <h4>Por bloco de ${TAM} (% de acerto entre as corrigidas)</h4>${blocos}
    <button id="refazer">🔄 Refazer lista inteira</button></details>`;
}

function renderLista(L) {
  const total = L.questoes.length;
  if (!total) return '<p class="card">Não consegui identificar questões neste PDF (talvez seja escaneado).</p>';
  const temGab = Object.keys(L.gabarito).length > 0, maxN = L.questoes[total - 1].num;
  const vis = visiveis(L); exibidas = vis.map((q) => q.num); const pend = pendentesTela(L).length;

  let h = temGab ? "" : '<p class="card">⚠️ Gabarito não encontrado no final do PDF — a correção não será possível.</p>';
  h += `<div id="rel">${relatorio(L)}</div>`;

  // Filtros + blocos
  let chips = `<button class="chip ${faixa.de <= 1 && faixa.ate >= maxN ? "on" : ""}" data-de="1" data-ate="9999">Todos</button>`;
  for (let s = 1; s <= maxN; s += TAM) {
    const e = Math.min(s + TAM - 1, maxN);
    chips += `<button class="chip ${faixa.de === s && faixa.ate === e ? "on" : ""}" data-de="${s}" data-ate="${e}">${s}–${e}</button>`;
  }
  h += `<div class="card"><div class="chips">${FILTROS.map(([k, t]) => `<button class="chip ${filtro === k ? "on" : ""}" data-f="${k}">${t}</button>`).join("")}</div>
    <div class="chips"><span class="muted">Blocos:</span>${chips}</div>
    <div>Da questão <input type="number" id="de" min="1" max="${maxN}" value="${faixa.de}"> até
    <input type="number" id="ate" min="1" max="${maxN}" value="${Math.min(faixa.ate, maxN)}"></div>
    <p class="muted">Exibindo ${vis.length} de ${total} questões</p></div>`;

  h += vis.map((q) => {
    const s = status(L, q), marc = L.respostas[q.num], certa = L.gabarito[q.num];
    const corr = ["acerto", "erro", "anulada"].includes(s);
    const fb = !corr ? "" : s === "acerto" ? `✅ Acertou! Gabarito: ${certa}` :
      s === "erro" ? `❌ Errou. Você marcou ${marc} — gabarito: ${certa}` : "Questão anulada / sem gabarito.";
    const cortadas = (L.riscadas && L.riscadas[q.num]) || "";
    const alts = Object.entries(q.alternativas).sort(([a], [b]) => a.localeCompare(b)).map(([k, t]) => {
      const cl = [cortadas.includes(k) ? "cut" : "", marc === k ? "sel" : "", corr && certa === k ? "certa" : "",
        corr && marc === k && certa && marc !== certa ? "errada" : ""].join(" ");
      return `<div class="altrow ${cl}"><label class="alt"><input type="radio" name="q${q.num}" value="${k}" data-q="${q.num}"
       ${marc === k ? "checked" : ""} ${corr ? "disabled" : ""}><span class="letra">${k}</span><span class="atxt">${q.tipo === "CE" ? t : esc(limpar(t))}</span></label>
       <button class="cut-btn" data-x="${q.num}|${k}" title="Riscar / desconsiderar">✂️</button></div>`;
    }).join("");
    const hd = cabecalhoQuestao(q.enunciado), matNome = ((materias.find((m) => m.id === L.materia)) || {}).nome;
    const badges = [["banca", hd.banca], ["ano", hd.ano], ["orgao", hd.orgao], ["mat", matNome]].filter((b) => b[1])
      .map(([k, v]) => `<span class="badge ${k}">${esc(v)}</span>`).join("");
    return `<div class="card q ${{ acerto: "ok", erro: "err", pendente: "pend" }[s] || ""}"><div class="qhead"><span class="qnum">Questão ${q.num}</span>
      <span class="qbtns"><button class="ia-btn" data-ia="${q.num}" title="Explicação direto na tela">🤖 Explicar com IA (FGV)</button>${corr ? `<button class="mini" data-rq="${q.num}">↺ refazer</button>` : ""}</span></div>
      <div class="badges">${badges}</div>
      <div class="enun">${htmlEnunciado(hd.resto)}</div><div class="alts">${alts}</div>
      ${fb ? `<p class="fb">${fb}</p>` : ""}<div id="ia-${q.num}">${iaBolha(L, q)}</div></div>`;
  }).join("") || '<p class="muted">Nenhuma questão para este filtro/bloco.</p>';

  return h + `<button id="corrigir" class="pri" ${temGab && pend ? "" : "disabled"}>✅ Corrigir questões marcadas (${pend})</button>`;
}

const MIN = 5; // mínimo de questões corrigidas para o diagnóstico ser considerado confiável
const sem = (t) => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const fmtAp = (r) => esc(r.material || "—") + (r.detalhe ? ` (${esc(r.detalhe)})` : "");

function statsMateria(m) { // acertos/erros nas questões corrigidas de todas as listas da matéria
  let ac = 0, er = 0, resp = 0, tot = 0;
  listas.filter((l) => l.materia === m.id).forEach((l) => {
    const c = contar(l, l.questoes); ac += c.acerto; er += c.erro; resp += l.questoes.length - c.branco; tot += l.questoes.length;
  });
  return { ac, er, resp, tot, corr: ac + er, pct: ac + er ? (ac / (ac + er)) * 100 : null };
}

function diagLinhas() { // cruza matérias das Questões com as apostilas cadastradas em Conteúdo (pelo nome)
  const mapa = new Map();
  const get = (nome) => { const k = sem(nome); if (!mapa.has(k)) mapa.set(k, { nome, st: null, reg: [], pas: [] }); return mapa.get(k); };
  materias.forEach((m) => { get(m.nome).st = statsMateria(m); });
  ((conteudo && conteudo.regular) || []).forEach((r) => get(r.nome).reg.push(r));
  ((conteudo && conteudo.passe) || []).forEach((r) => get(r.nome).pas.push(r));
  return [...mapa.values()];
}

function nivel(x) {
  const st = x.st;
  if (!st || st.corr < MIN) return { k: "nd", ic: "⚪", txt: st && st.corr ? `Poucos dados (${st.corr} corrigidas)` : "Sem questões corrigidas" };
  if (st.pct < 60) return { k: "alto", ic: "🔴", txt: "Revisar com prioridade" };
  if (st.pct < 75) return { k: "med", ic: "🟡", txt: "Atenção" };
  return { k: "ok", ic: "🟢", txt: "Bom desempenho" };
}

const diasDe = (nome) => {
  if (!cron) return "";
  const c = cicloAtivo();
  return DIAS.filter(([k]) => ((c.dias && c.dias[k]) || []).some((n) => sem(n) === sem(nome))).map(([, d]) => d.slice(0, 3)).join(", ");
};

function diagHTML() {
  if (!conteudo) return "";
  const linhas = diagLinhas().map((x) => ({ ...x, nv: nivel(x) }));
  const comDados = linhas.filter((x) => x.st && x.st.corr >= MIN).sort((a, b) => a.st.pct - b.st.pct); // piores primeiro
  const resto = linhas.filter((x) => !(x.st && x.st.corr >= MIN)).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  const ap = (x) => [...x.reg.map((r) => `📘 ${fmtAp(r)}`), ...x.pas.map((r) => `⭐ Passe: ${fmtAp(r)}`)].join(" · ") || "sem apostila cadastrada (cadastre abaixo)";
  const foco = comDados.filter((x) => x.st.pct < 75).slice(0, 3);
  const topo = foco.length
    ? `<div class="foco"><b>🎯 Foco da semana — revise primeiro:</b>` + foco.map((x) => {

      }).join("") + "</div>"
    : comDados.length ? '<div class="foco ok">🎉 Todas as matérias com dados estão com 75% ou mais. Continue assim!</div>'
    : `<div class="foco nd">Resolva e corrija pelo menos ${MIN} questões de uma matéria (aba Questões) para gerar o diagnóstico.</div>`;
  const linha = (x) => {
    const st = x.st, p = st && st.corr ? st.pct : null;
    return `<div class="drow ${x.nv.k}"><div class="dtop"><b>${esc(x.nome)}</b><span class="nvb">${x.nv.ic} ${x.nv.txt}</span></div>
      <div class="dpctrow"><span class="dpct">${p === null ? "—" : p.toFixed(0) + "%"}</span><div class="bar big"><i class="s-${x.nv.k}" style="width:${p === null ? 0 : p}%"></i></div></div>
      <div class="muted">${p === null ? "Sem questões corrigidas" : `${p.toFixed(0)}% · ${st.ac} acertos / ${st.er} erros`}${st ? ` · ${st.resp}/${st.tot} respondidas` : ""}</div>
      <div class="dap">${ap(x)}</div></div>`;
  };
  return topo + `<div class="dlist">${[...comDados, ...resto].map(linha).join("")}</div>`;
}

function dadosQuestao(L, q) {
  const mat = ((materias.find((m) => m.id === L.materia)) || {}).nome || "";
  const ce = q.tipo === "CE", nomeR = (r) => (!r ? "" : ce ? (r === "C" ? "Certo" : r === "E" ? "Errado" : r) : r);
  const alts = ce ? "Julgue: Certo ou Errado." : Object.entries(q.alternativas).sort(([a], [b]) => a.localeCompare(b)).map(([k, t]) => `${k}) ${limpar(t)}`).join("\n");
  const marc = L.respostas[q.num], certa = L.gabarito[q.num], temGab = certa && certa !== "ANULADA";
  const situ = marc && temGab ? (marc === certa
    ? "Eu ACERTEI: confirme se o meu raciocínio faz sentido e aprofunde o tema."
    : "Eu ERREI: explique onde está o erro e a armadilha que provavelmente me levou a essa alternativa.") : "";
  return `Matéria: ${mat || "não informada"}
Questão ${q.num}:
${limpar(q.enunciado)}

${alts}

Minha resposta: ${nomeR(marc) || "não respondi"}
Gabarito oficial: ${temGab ? nomeR(certa) : "não informado"}
${situ}`.trim();
}
const promptIA = (L, q) => SISTEMA_IA + "\n\n---\n\n" + dadosQuestao(L, q); // versão única (link do ChatGPT / cópia)

function explicarIA(L, q) { // abre o ChatGPT em nova aba (e copia o prompt como garantia)
  const txt = promptIA(L, q), url = "https://chatgpt.com/?q=" + encodeURIComponent(txt), longo = url.length > 6500;
  window.open(longo ? "https://chatgpt.com/" : url, "_blank", "noopener");
  if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  aviso(longo ? "Prompt copiado! Cole no ChatGPT." : "Abrindo o ChatGPT… (o prompt também foi copiado)");
}

const cfgIA = () => { try { return JSON.parse(localStorage.getItem("ia_cfg") || "{}"); } catch (e) { return {}; } };
const MODELOS = { gemini: "gemini-3.1-pro-preview", openai: "gpt-4o-mini", anthropic: "claude-sonnet-5-5" };

const mdLite = (t) => esc(t).replace(/^#{1,4}\s*(.+)$/gm, "<h4>$1</h4>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^\s*[-*]\s+/gm, "• ");

const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
async function geminiUma(modelo, sistema, usuario, key) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 150000); // Pro pode demorar
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelo)}:generateContent`, {
      method: "POST", signal: ctl.signal, headers: { "content-type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: sistema }] }, contents: [{ role: "user", parts: [{ text: usuario }] }],
        generationConfig: { maxOutputTokens: 8192 } }) }); // temperatura padrão (recomendada nos modelos Gemini 3)
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error((j.error && j.error.message) || "HTTP " + r.status); e.status = r.status; throw e; }
    const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
    const txt = parts.map((x) => x.text || "").join("");
    if (!txt) throw new Error((j.promptFeedback && j.promptFeedback.blockReason) || "Resposta vazia do Gemini");
    return txt;
  } catch (e) { if (e.name === "AbortError") { e.status = 504; e.message = "Tempo esgotado"; } throw e; }
  finally { clearTimeout(to); }
}
// Linha Pro primeiro; em alta demanda tenta de novo e, se preciso, cai para o próximo modelo
async function gemini(c, sistema, usuario, info) {
  const cadeia = [...new Set([c.model || MODELOS.gemini, MODELOS.gemini, "gemini-3-flash-preview", "gemini-2.5-flash"])];
  let ultimo;
  for (let i = 0; i < cadeia.length; i++) {
    const m = cadeia[i];
    for (let t = 0; t < 3; t++) {
      try { return { txt: await geminiUma(m, sistema, usuario, c.key), modelo: m }; }
      catch (err) {
        ultimo = err;
        if (err.status === 401 || err.status === 403 || (err.status === 400 && /api key/i.test(err.message))) throw err; // chave inválida
        if ([500, 502, 503, 504].includes(err.status) && t < 2) {
          if (info) info(`Alta demanda em ${m}. Nova tentativa (${t + 2}/3)…`);
          await esperar(2000 * (t + 1)); continue;
        }
        break; // 404 / 429 / outros: próximo modelo
      }
    }
    if (info && i + 1 < cadeia.length) info(`${m} indisponível agora. Tentando ${cadeia[i + 1]}…`);
  }
  throw ultimo;
}

async function chamarIA(sistema, usuario, c, info) {
  const prov = c.prov || "gemini", modelo = c.model || MODELOS[prov] || MODELOS.gemini;
  const erro = (j, r) => new Error((j.error && (j.error.message || j.error)) || r.status);
  if (prov === "gemini") return gemini(c, sistema, usuario, info);
  if (prov === "anthropic") {
    const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST",
      headers: { "content-type": "application/json", "x-api-key": c.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: modelo, max_tokens: 2500, system: sistema, messages: [{ role: "user", content: usuario }] }) });
    const j = await r.json(); if (!r.ok) throw erro(j, r);
    return { txt: j.content.map((b) => b.text || "").join(""), modelo };
  }
  const r = await fetch("https://api.openai.com/v1/chat/completions", { method: "POST",
    headers: { "content-type": "application/json", Authorization: "Bearer " + c.key },
    body: JSON.stringify({ model: modelo, temperature: 0.3, messages: [{ role: "system", content: sistema }, { role: "user", content: usuario }] }) });
  const j = await r.json(); if (!r.ok) throw erro(j, r);
  return { txt: j.choices[0].message.content, modelo };
}

// Divide a resposta em seções (### títulos) para o cartão do professor
function mdSecoes(t) {
  const partes = t.split(/^#{1,4}[ \t]*/m);
  const intro = /^\s*#/.test(t) ? "" : partes.shift();
  const sec = partes.filter((x) => x.trim()).map((p) => {
    const i = p.indexOf("\n"), tit = (i < 0 ? p : p.slice(0, i)).trim(), corpo = i < 0 ? "" : p.slice(i + 1).trim();
    const k = /pegadinha/i.test(tit) ? "warn" : /gabarito/i.test(tit) ? "ok" : /recorr/i.test(tit) ? "info" : /base legal|jurisprud/i.test(tit) ? "law" : "";
    return `<section class="isec ${k}"><h4>${esc(tit)}</h4><div class="isb">${mdLite(corpo)}</div></section>`;
  }).join("");
  return (intro && intro.trim() ? `<div class="isb">${mdLite(intro.trim())}</div>` : "") + sec;
}

function iaBolha(L, q) {
  const e = iaSt[L.id + "|" + q.num];
  if (!e || !e.open) return "";
  const corpo = e.estado === "carregando" ? `<div class="isb muted">⏳ ${esc(e.info || "O professor está analisando a questão…")}</div>`
    : e.estado === "semchave" ? '<div class="isb">Para gerar a explicação aqui dentro do app, configure sua chave de API em <b>⚙️</b> (Google Gemini recomendado).\n\nEnquanto isso, use <b>↗ ChatGPT</b> para abrir o prompt pronto.</div>'
    : e.estado === "erro" ? `<div class="isb">❌ Não foi possível gerar a explicação: ${esc(e.msg || "")}\n\n<span class="muted">Confira a chave e o modelo em ⚙️.</span></div>`
    : mdSecoes((L.ia || {})[q.num] || "");
  return `<div class="iabox"><div class="iahead"><span class="iatitle"><span class="iaav">🎓</span><span><b>Professor FGV · Área Fiscal</b>
    <small>${e.modelo ? "via " + esc(e.modelo) : "mentor de elite"}</small></span></span><span class="iabtns">
    <button data-iarege="${q.num}" title="Gerar novamente">🔄</button><button data-iacopy="${q.num}" title="Copiar">📋</button>
    <button data-iagpt="${q.num}" title="Abrir no ChatGPT">↗ ChatGPT</button><button data-iacfg="1" title="Configurar IA">⚙️</button>
    <button data-iaclose="${q.num}" title="Fechar">✕</button></span></div><div class="iabody">${corpo}</div></div>`;
}
const atualizarBolha = (L, q) => { const el = $("ia-" + q.num); if (el) el.innerHTML = iaBolha(L, q); };

async function abrirIA(L, q, forcar) {
  const k = L.id + "|" + q.num, e = iaSt[k] || (iaSt[k] = {});
  if (e.estado === "carregando") return;
  if (e.open && !forcar) { e.open = false; atualizarBolha(L, q); return; } // clicar de novo recolhe
  e.open = true;
  const cache = L.ia && L.ia[q.num];
  if (cache && !forcar) { e.estado = "ok"; atualizarBolha(L, q); return; } // já gerada (salva na nuvem)
  const c = cfgIA();
  if (!c.key) { e.estado = "semchave"; atualizarBolha(L, q); return; }
  e.estado = "carregando"; e.info = ""; atualizarBolha(L, q);
  const el = $("ia-" + q.num); if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  try {
    const r = await chamarIA(SISTEMA_IA, dadosQuestao(L, q), c, (m) => { e.info = m; atualizarBolha(L, q); });
    const txt = r.txt.trim(); e.modelo = r.modelo;
    L.ia = L.ia || {}; L.ia[q.num] = txt;
    updateDoc(ref("listas", L.id), { [`ia.${q.num}`]: txt }).catch(falha);
    e.estado = "ok";
  } catch (err) { e.estado = "erro"; e.msg = String(err.message || err); }
  atualizarBolha(L, q);
}

function iaAcao(k, L, q) {
  if (k === "ia") abrirIA(L, q);
  else if (k === "iarege") abrirIA(L, q, true);
  else if (k === "iaclose") { iaSt[L.id + "|" + q.num].open = false; atualizarBolha(L, q); }
  else if (k === "iacopy") { if (navigator.clipboard) navigator.clipboard.writeText((L.ia || {})[q.num] || "").catch(() => {}); aviso("Copiado!"); }
  else if (k === "iagpt") explicarIA(L, q);
}

const hue = (n) => { let h = 0; for (const c of (n || "?").toLowerCase()) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

// Extrai "(FGV / SEFAZ-MG / 2022)" do início do enunciado -> badges de Banca / Ano / Órgão
function cabecalhoQuestao(enun) {
  enun = enun || "";
  const m = /^\s*\(([^)]{3,90})\)\s*/.exec(enun);
  if (!m) return { resto: enun };
  const ano = (m[1].match(/\b(?:19|20)\d{2}\b/) || [])[0];
  if (!ano) return { resto: enun };
  const toks = m[1].split(/\s*[\/–—]\s*|\s+-\s+/).map((x) => x.trim()).filter(Boolean);
  const anoTok = (x) => /^(?:19|20)\d{2}$/.test(x);
  const banca = toks.find((x) => !anoTok(x));
  if (!banca || !/^[A-Za-zÀ-ú.&\- ]{2,28}$/.test(banca)) return { resto: enun }; // não parece um cabeçalho de banca
  const orgao = toks.find((x) => !anoTok(x) && x !== banca);
  return { banca, ano, orgao, resto: enun.slice(m[0].length) };
}

// Matérias disponíveis para o cronograma (Conteúdo + Questões + já usadas), sem repetir
function poolMaterias() {
  const m = new Map();
  const add = (n) => { n = (n || "").trim(); if (n && !m.has(n.toLowerCase())) m.set(n.toLowerCase(), n); };
  [...(conteudo?.regular || []), ...(conteudo?.passe || []), ...materias].forEach((x) => add(x.nome));
  (cron?.ciclos || []).forEach((c) => Object.values(c.dias || {}).flat().forEach(add));
  return [...m.values()].sort((a, b) => a.localeCompare(b, "pt-BR", { sensitivity: "base" }));
}
const cicloAtivo = () => cron.ciclos.find((x) => x.id === cron.ativo) || cron.ciclos[0];

function renderCron() {
  const el = $("secCronograma");
  if (!cron) { el.innerHTML = '<p class="muted">Carregando...</p>'; return; }
  const c = cicloAtivo(), pool = poolMaterias();
  const hoje = ["dom", "seg", "ter", "qua", "qui", "sex", "sab"][new Date().getDay()];
  el.innerHTML = `<div class="ctop"><h2>🗓️ Cronograma</h2></div>
    <div class="kbar"><div class="tabs">${cron.ciclos.map((x) => `<button class="tab ${x.id === c.id ? "on" : ""}" data-kc="${x.id}">${esc(x.nome)}</button>`).join("")}
      <button class="tab add" data-knovo="1">➕ Novo ciclo</button></div>
      <div class="kact"><button data-kren="1">✏️ Renomear</button><button data-kdel="1" ${cron.ciclos.length < 2 ? "disabled" : ""}>🗑️ Excluir</button></div></div>
    <div class="kgrid">` + DIAS.map(([k, nome]) => {
      const ms = (c.dias && c.dias[k]) || [], desc = !ms.length;
      const livres = pool.filter((n) => !ms.some((x) => x.toLowerCase() === n.toLowerCase()));
      return `<div class="kdia ${k === hoje ? "hoje" : ""} ${desc ? "descanso" : ""}">
        <div class="khead"><span class="kico">${desc ? "😴" : "📅"}</span><b>${nome.replace("-feira", "")}</b>${k === hoje ? '<span class="tag">HOJE</span>' : ""}
          <span class="kcount">${desc ? "Descanso" : ms.length + (ms.length > 1 ? " matérias" : " matéria")}</span></div>
        <div class="kbody">${desc ? '<p class="muted">Dia livre para recarregar as energias.</p>' :
          `<div class="chips">${ms.map((n, i) => `<span class="pill" style="--h:${hue(n)}"><span>${esc(n)}</span><button data-krem="${k}|${i}" title="Remover">✕</button></span>`).join("")}</div>`}
          <select data-kadd="${k}"><option value="">➕ Adicionar matéria…</option>${livres.map((n) => `<option>${esc(n)}</option>`).join("")}
          <option value="__novo__">✏️ Outra (digitar)…</option></select></div></div>`;
    }).join("") + "</div>";
}

document.addEventListener("click", (e) => {
  const t = e.target, d = (k) => t.closest(`[data-${k}]`)?.dataset[k];
  if (d("sec")) return mostrarSecao(d("sec"));
  const ik = ["ia", "iarege", "iaclose", "iacopy", "iagpt"].find((k) => d(k));
  if (ik) {
    const L = listaAtual(), q = L && L.questoes.find((x) => String(x.num) === d(ik));
    if (q) iaAcao(ik, L, q);
    return;
  }
  if (d("iacfg")) return abrirCfg();
  if (conteudo && d("cadd")) {
    abrirDlg(d("cadd"));
  } else if (conteudo && d("cdel")) {
    const [sec, i] = d("cdel").split("|"), r = conteudo[sec][+i];
    if (!confirm(`Remover "${r.nome}"?`)) return;
    conteudo[sec].splice(+i, 1); salvarConteudo(); renderConteudo();
  } else if (cron && d("kc")) { cron.ativo = d("kc"); salvarCron(); renderCron(); }
  else if (cron && d("knovo")) {
    const nome = (prompt("Nome do novo ciclo:", `Ciclo ${cron.ciclos.length + 1}`) || "").trim();
    if (!nome) return;
    const id = "c" + Date.now();
    cron.ciclos.push({ id, nome, dias: { seg: [], ter: [], qua: [], qui: [], sex: [], sab: [], dom: [] } });
    cron.ativo = id; salvarCron(); renderCron();
  } else if (cron && d("kren")) {
    const c = cicloAtivo(), nome = (prompt("Novo nome do ciclo:", c.nome) || "").trim();
    if (nome) { c.nome = nome; salvarCron(); renderCron(); }
  } else if (cron && d("kdel")) {
    if (cron.ciclos.length < 2 || !confirm("Excluir este ciclo?")) return;
    cron.ciclos = cron.ciclos.filter((x) => x.id !== cicloAtivo().id);
    cron.ativo = cron.ciclos[0].id; salvarCron(); renderCron();
  } else if (cron && d("krem")) {
    const [dia, i] = d("krem").split("|");
    cicloAtivo().dias[dia].splice(+i, 1); salvarCron(); renderCron();
  }
});

async function autenticar(criar) {
  $("erroLogin").textContent = "";
  try {
    // "Lembrar de mim": sessão guardada no aparelho; desmarcado = termina ao fechar o navegador
    await setPersistence(auth, $("lembrar").checked ? browserLocalPersistence : browserSessionPersistence);
    const fn = criar ? createUserWithEmailAndPassword : signInWithEmailAndPassword;
    await fn(auth, $("email").value.trim(), $("senha").value);
  } catch (e) { $("erroLogin").textContent = msgErro(e); }
}
$("formLogin").onsubmit = (e) => { e.preventDefault(); autenticar(false); };
$("btnCriar").onclick = () => { if ($("formLogin").reportValidity()) autenticar(true); };
$("btnReset").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) { $("erroLogin").textContent = "Digite seu e-mail acima primeiro."; return; }
  try { await sendPasswordResetEmail(auth, email); $("erroLogin").textContent = "Enviamos um e-mail para redefinir a senha."; }
  catch (e) { $("erroLogin").textContent = msgErro(e); }
};
$("sair").onclick = () => signOut(auth);

onAuthStateChanged(auth, (u) => {
  unsubs.forEach((f) => f()); unsubs = [];
  user = u; materias = []; listas = []; conteudo = null; cron = null;
  $("login").hidden = !!u; $("app").hidden = !u; $("conta").hidden = !u;
  $("usuario").textContent = u ? u.displayName || u.email : "";
  if (!u) return;
  unsubs.push(onSnapshot(col("materias"), (s) => {
    materias = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(); atualizarDiag();
  }, falha));
  unsubs.push(onSnapshot(col("listas"), (s) => {
    const n = s.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (sig(n) === sig(listas)) return; // já refletido localmente: evita redesenhar/pular a tela
    listas = n; render(); atualizarDiag();
  }, falha));
  // Conteúdo e Cronograma: cria os dados iniciais na primeira vez (somente após confirmar com o servidor)
  unsubs.push(onSnapshot(cfgRef("conteudo"), (s) => {
    if (!s.exists()) { if (!s.metadata.fromCache) { conteudo = structuredClone(SEED_CONT); salvarConteudo(); renderConteudo(); } return; }
    if (conteudo && canon(s.data()) === canon(conteudo)) return; // já refletido localmente
    conteudo = s.data(); if (secao === "conteudo") renderConteudo(); else if (secao === "cronograma") renderCron();
  }, falha));
  unsubs.push(onSnapshot(cfgRef("cronograma"), (s) => {
    if (!s.exists()) { if (!s.metadata.fromCache) { cron = structuredClone(SEED_CRON); salvarCron(); renderCron(); } return; }
    if (cron && canon(s.data()) === canon(cron)) return;
    cron = s.data(); if (secao === "cronograma") renderCron();
  }, falha));
  mostrarSecao(secao);
});

// ---------- Eventos ----------
document.addEventListener("click", async (e) => {
  const t = e.target, d = (k) => t.closest(`[data-${k}]`)?.dataset[k], L = listaAtual();
  const upd = (obj) => updateDoc(ref("listas", L.id), obj).catch(falha);
  if (d("x")) { // ✂️ descartar/restaurar alternativa (salvo na nuvem)
    const [n, k] = d("x").split("|");
    L.riscadas = L.riscadas || {};
    const cs = new Set((L.riscadas[n] || "").split("").filter(Boolean));
    if (cs.has(k)) cs.delete(k); else cs.add(k);
    const str = [...cs].sort().join("");
    if (str) L.riscadas[n] = str; else delete L.riscadas[n];
    upd({ [`riscadas.${n}`]: str || deleteField() });
    t.closest(".altrow").classList.toggle("cut", cs.has(k));
  } else if (d("dl")) {
    if (confirm("Excluir esta lista?")) deleteDoc(ref("listas", d("dl"))).catch(falha);
  } else if (d("rn")) { renomearLista(d("rn")); }
  else if (d("l")) { sel.lista = d("l"); saveUi(); render(); }
  else if (d("m")) { sel = { materia: d("m"), lista: null }; saveUi(); render(); }
  else if (t.closest("#novaMat")) {
    const nome = (prompt("Nome da nova matéria:") || "").trim();
    if (!nome) return;
    if (materias.some((m) => m.nome.toLowerCase() === nome.toLowerCase())) return alert("Essa matéria já existe.");
    try { const r = await addDoc(col("materias"), { nome, criado: Date.now() }); sel = { materia: r.id, lista: null }; saveUi(); render(); }
    catch (err) { falha(err); }
  } else if (d("dm")) {
    if (!confirm("Excluir esta matéria e todas as suas listas?")) return;
    const b = writeBatch(fs);
    listas.filter((l) => l.materia === d("dm")).forEach((l) => b.delete(ref("listas", l.id)));
    b.delete(ref("materias", d("dm")));
    b.commit().catch(falha);
  } else if (d("f")) { filtro = d("f"); saveUi(); render(); }
  else if (d("de")) { faixa = { de: +d("de"), ate: +t.closest("[data-de]").dataset.ate }; saveUi(); render(); }
  else if (d("rq")) {
    const n = d("rq"); delete L.respostas[n]; delete L.corrigidas[n]; if (L.riscadas) delete L.riscadas[n];
    upd({ [`respostas.${n}`]: deleteField(), [`corrigidas.${n}`]: deleteField(), [`riscadas.${n}`]: deleteField() }); render();
  } else if (t.id === "corrigir") { // corrige só as marcadas entre as exibidas
    const o = {};
    pendentesTela(L).forEach((q) => { L.corrigidas[q.num] = true; o[`corrigidas.${q.num}`] = true; });
    upd(o); render();
  } else if (t.id === "refazer") {
    if (!confirm("Apagar todas as respostas desta lista?")) return;
    L.respostas = {}; L.corrigidas = {}; L.riscadas = {}; upd({ respostas: {}, corrigidas: {}, riscadas: {} }); render();
  }
});

document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.q) { // marcou alternativa: atualiza na tela e grava na nuvem
    const L = listaAtual();
    L.respostas[t.dataset.q] = t.value;
    t.closest(".q").querySelectorAll(".altrow").forEach((r) => r.classList.toggle("sel", r.contains(t)));
    updateDoc(ref("listas", L.id), { [`respostas.${t.dataset.q}`]: t.value }).catch(falha);
    $("rel").innerHTML = relatorio(L);
    atualizarBotao(L);
    atualizarLinha(L);
  } else if (t.id === "de" || t.id === "ate") {
    faixa = { de: Math.max(1, +$("de").value || 1), ate: +$("ate").value || 9999 }; saveUi(); render();
  } else if (t.id === "pdf") {
    const st = $("status");
    for (const f of t.files) {
      st.textContent = `Processando ${f.name}...`;
      try {
        const { id, ...l } = await processarPDF(f);
        if (JSON.stringify(l).length > 900000) throw new Error("PDF grande demais para um documento do Firestore (limite ~1 MB).");
        const r = await addDoc(col("listas"), { ...l, materia: sel.materia, criado: Date.now() });
        sel.lista = r.id; saveUi();
      } catch (err) { console.error(err); alert(`Erro ao processar ${f.name}: ${err.message}`); }
    }
    render();
  }
});
</script>
